name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ffmpeg (for video tests)
        run: choco install ffmpeg --no-progress -y
      - name: Install
        run: python -m pip install -e ".[dev,dnd]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -v -o faulthandler_timeout=120

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[build,dnd]"
      - name: Build exe
        run: python scripts/build_exe.py
      - name: Smoke test exe
        run: python scripts/smoke_test.py dist/StripMetadata.exe
      - uses: actions/upload-artifact@v7
        with:
          name: StripMetadata-exe
          path: dist/StripMetadata.exe
          retention-days: 14
