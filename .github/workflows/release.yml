name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check tag matches version
        shell: pwsh
        run: |
          $v = (Select-String -Path src/strip_metadata/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $v" }

      - name: Build exe
        run: |
          python -m pip install -e ".[build,dnd,dev,watermark]"
          python scripts/build_exe.py

      - name: Smoke test exe
        run: python scripts/smoke_test.py dist/StripMetadata.exe --watermark

      # Code signing via SignPath Foundation. Runs only after the project is approved and
      # SIGNPATH_API_TOKEN (secret) + SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
      # SIGNPATH_SIGNING_POLICY_SLUG (variables) are set; until then the release is unsigned.
      - name: Upload unsigned exe for signing
        id: unsigned
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: dist/StripMetadata.exe
          if-no-files-found: error

      - name: Sign exe (SignPath, needs manual approval)
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use signed exe
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          Copy-Item signed/StripMetadata.exe dist/StripMetadata.exe -Force
          $sig = Get-AuthenticodeSignature dist/StripMetadata.exe
          "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "exe is not validly signed" }
          python scripts/smoke_test.py dist/StripMetadata.exe

      - name: Package (exe alone, and exe + ffmpeg for videos)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/StripMetadata.exe "release/StripMetadata-$tag.exe"

          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_src
          $bin = Get-ChildItem ffmpeg_src -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffroot = $bin.Directory.Parent.FullName
          $pkg = "pkg/StripMetadata"
          New-Item -ItemType Directory -Force "$pkg/ffmpeg" | Out-Null
          Copy-Item dist/StripMetadata.exe $pkg
          Copy-Item "$($bin.Directory.FullName)/ffmpeg.exe", "$($bin.Directory.FullName)/ffprobe.exe" "$pkg/ffmpeg"
          Copy-Item "$ffroot/LICENSE" "$pkg/ffmpeg/LICENSE.txt"
          "ffmpeg build from https://www.gyan.dev/ffmpeg/builds/ ($(Split-Path $ffroot -Leaf)). Source code: https://ffmpeg.org/download.html" | Set-Content "$pkg/ffmpeg/README.txt"
          Compress-Archive -Path $pkg -DestinationPath "release/StripMetadata-$tag-with-ffmpeg.zip"

          Get-ChildItem release | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Smoke test packaged ffmpeg build (video)
        shell: pwsh
        run: python scripts/smoke_test.py pkg/StripMetadata/StripMetadata.exe --video "pkg/StripMetadata/ffmpeg/ffmpeg.exe"

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            **下載哪一個？**
            - `StripMetadata-${{ github.ref_name }}-with-ffmpeg.zip`：解壓後執行 `StripMetadata.exe`，相片和影片都能處理（建議）。
            - `StripMetadata-${{ github.ref_name }}.exe`：單一檔案，只處理相片；電腦已裝 ffmpeg 的話也能處理影片。

            Windows 第一次開啟可能跳出「Windows 已保護您的電腦」，按「其他資訊」→「仍要執行」。
